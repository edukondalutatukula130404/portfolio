<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="erpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#erpBg)" rx="16"/>

  <g transform="translate(45, 35)">
    <!-- Browser Frame -->
    <rect width="710" height="430" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="25" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="25" r="5" fill="#27c93f"/>
    <rect x="220" y="14" width="270" height="22" rx="11" fill="#1e293b"/>
    <text x="355" y="29" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">https://erp.speshway.site</text>
    <line x1="0" y1="48" x2="710" y2="48" stroke="#1e293b" stroke-width="1"/>

    <!-- Left Mini Sidebar -->
    <rect x="0" y="48" width="170" height="382" fill="#0b1120"/>
    <line x1="170" y1="48" x2="170" y2="430" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="80" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="800">SPESHWAY ERP</text>
    
    <rect x="12" y="98" width="146" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="117" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">📊 Dashboard</text>

    <text x="30" y="152" fill="#94a3b8" font-family="sans-serif" font-size="11">📦 Inventory</text>
    <text x="30" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">💰 Accounting</text>
    <text x="30" y="218" fill="#94a3b8" font-family="sans-serif" font-size="11">👥 Human Resources</text>
    <text x="30" y="251" fill="#94a3b8" font-family="sans-serif" font-size="11">🚚 Supply Chain</text>
    <text x="30" y="284" fill="#94a3b8" font-family="sans-serif" font-size="11">⚙ Settings</text>

    <!-- Top KPI Cards -->
    <rect x="190" y="65" width="155" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="205" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10.5">MONTHLY REVENUE</text>
    <text x="205" y="118" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">$248,500</text>
    <text x="295" y="118" fill="#22c55e" font-family="sans-serif" font-size="10.5">+14.2% ↑</text>

    <rect x="360" y="65" width="155" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="375" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10.5">ACTIVE ORDERS</text>
    <text x="375" y="118" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">1,420</text>
    <text x="450" y="118" fill="#38bdf8" font-family="sans-serif" font-size="10.5">Processing</text>

    <rect x="530" y="65" width="155" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="545" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10.5">INVENTORY EFFICIENCY</text>
    <text x="545" y="118" fill="#22c55e" font-family="sans-serif" font-size="18" font-weight="bold">99.1%</text>
    <text x="620" y="118" fill="#22c55e" font-family="sans-serif" font-size="10.5">Optimal</text>

