    <line x1="210" y1="210" x2="665" y2="210" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="210" y1="260" x2="665" y2="260" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="210" y1="310" x2="665" y2="310" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="210" y1="360" x2="665" y2="360" stroke="#334155" stroke-width="1.5"/>

    <!-- Bars -->
    <rect x="235" y="250" width="28" height="110" rx="4" fill="url(#cyanAccent)"/>
    <rect x="295" y="210" width="28" height="150" rx="4" fill="url(#cyanAccent)"/>
    <rect x="355" y="235" width="28" height="125" rx="4" fill="url(#cyanAccent)"/>
    <rect x="415" y="190" width="28" height="170" rx="4" fill="url(#cyanAccent)"/>
    <rect x="475" y="220" width="28" height="140" rx="4" fill="url(#cyanAccent)"/>
    <rect x="535" y="175" width="28" height="185" rx="4" fill="url(#cyanAccent)"/>
    <rect x="595" y="160" width="28" height="200" rx="4" fill="url(#cyanAccent)"/>

    <!-- Trend line -->
    <path d="M249 240 L309 200 L369 220 L429 180 L489 210 L549 165 L609 150" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="609" cy="150" r="5" fill="#f59e0b"/>
