<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#webBg)" rx="16"/>

  <g transform="translate(45, 35)">
    <rect width="710" height="430" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="25" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="25" r="5" fill="#27c93f"/>
    <text x="355" y="30" fill="#a1a1aa" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Responsive Web Architecture &amp; UI Portfolio</text>
    <line x1="0" y1="48" x2="710" y2="48" stroke="#3f3f46" stroke-width="1"/>

    <!-- Hero preview -->
    <rect x="25" y="65" width="660" height="140" rx="10" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="50" y="115" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="2">MODERN WEB EXPERIENCES</text>
    <text x="50" y="145" fill="#a1a1aa" font-family="sans-serif" font-size="12">Semantic HTML5 • CSS3 Responsive Grid • JavaScript Interactivity</text>
    <rect x="530" y="105" width="130" height="38" rx="19" fill="#ffffff"/>
    <text x="595" y="129" fill="#09090b" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Live Demo ↗</text>

    <!-- 3 columns -->
    <rect x="25" y="225" width="205" height="180" rx="10" fill="#202023" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="55" cy="255" r="14" fill="#e44d26"/>
    <text x="55" y="259" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5</text>
    <text x="45" y="300" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">HTML5 Semantics</text>
    <text x="45" y="325" fill="#a1a1aa" font-family="sans-serif" font-size="11">Clean, structured</text>
    <text x="45" y="342" fill="#a1a1aa" font-family="sans-serif" font-size="11">accessible DOM markup.</text>

    <rect x="250" y="225" width="205" height="180" rx="10" fill="#202023" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="280" cy="255" r="14" fill="#264de4"/>
    <text x="280" y="259" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    <text x="270" y="300" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">CSS3 Architecture</text>
    <text x="270" y="325" fill="#a1a1aa" font-family="sans-serif" font-size="11">Fluid responsive layout</text>
    <text x="270" y="342" fill="#a1a1aa" font-family="sans-serif" font-size="11">and CSS animation keyframes.</text>

    <rect x="475" y="225" width="205" height="180" rx="10" fill="#202023" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="505" cy="255" r="14" fill="#f7df1e"/>
    <text x="505" y="259" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">JS</text>
    <text x="495" y="300" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">JavaScript Controls</text>
    <text x="495" y="325" fill="#a1a1aa" font-family="sans-serif" font-size="11">Dynamic modals, routing,</text>
    <text x="495" y="342" fill="#a1a1aa" font-family="sans-serif" font-size="11">and interactive components.</text>
  </g>
