<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5f6f8"/>
      <stop offset="100%" stop-color="#ebeef2"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dce4ed" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <rect width="1440" height="600" fill="url(#skyGrad)"/>

  <g filter="url(#blurFilter)">
    <circle cx="200" cy="380" r="180" fill="url(#cloudGrad)"/>
    <circle cx="450" cy="420" r="230" fill="url(#cloudGrad)"/>
    <circle cx="750" cy="390" r="260" fill="url(#cloudGrad)"/>
    <circle cx="1080" cy="410" r="240" fill="url(#cloudGrad)"/>
    <circle cx="1320" cy="370" r="190" fill="url(#cloudGrad)"/>
  </g>
</svg>