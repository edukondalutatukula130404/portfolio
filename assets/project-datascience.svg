<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#111d33"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dsBg)" rx="16"/>
  
  <g transform="translate(45, 35)">
    <rect width="710" height="430" rx="14" fill="#0e1726" stroke="#1c2d4a" stroke-width="1.5"/>
    
    <!-- Header -->
    <circle cx="25" cy="25" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="25" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="25" r="5" fill="#27c93f"/>
    <text x="355" y="30" fill="#7592ba" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Science Using Python • Council for Skills &amp; Competencies</text>
    <line x1="0" y1="48" x2="710" y2="48" stroke="#1c2d4a" stroke-width="1"/>

    <!-- Metric Cards Row -->
    <rect x="25" y="65" width="200" height="75" rx="8" fill="#132035" stroke="#223759" stroke-width="1"/>
    <text x="40" y="88" fill="#89a5cb" font-family="sans-serif" font-size="11">MODEL ACCURACY</text>
    <text x="40" y="122" fill="#00d2ff" font-family="sans-serif" font-size="24" font-weight="bold">98.4%</text>
    <text x="145" y="122" fill="#27c93f" font-family="sans-serif" font-size="11">High Conf</text>

    <rect x="255" y="65" width="200" height="75" rx="8" fill="#132035" stroke="#223759" stroke-width="1"/>
    <text x="270" y="88" fill="#89a5cb" font-family="sans-serif" font-size="11">DATASET OBSERVATIONS</text>
    <text x="270" y="122" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">120K+</text>
    <text x="395" y="122" fill="#89a5cb" font-family="sans-serif" font-size="11">Rows</text>

    <rect x="485" y="65" width="200" height="75" rx="8" fill="#132035" stroke="#223759" stroke-width="1"/>
    <text x="500" y="88" fill="#89a5cb" font-family="sans-serif" font-size="11">LATENCY PER INFERENCE</text>
    <text x="500" y="122" fill="#3a7bd5" font-family="sans-serif" font-size="24" font-weight="bold">14 ms</text>
    <text x="600" y="122" fill="#27c93f" font-family="sans-serif" font-size="11">Optimized</text>

    <!-- Main Chart -->
    <rect x="25" y="155" width="430" height="250" rx="10" fill="#111b2b" stroke="#1c2d4a" stroke-width="1"/>
    <text x="45" y="185" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Model Performance &amp; Confusion Matrix Metrics</text>
    
    <line x1="45" y1="215" x2="430" y2="215" stroke="#1c2d4a" stroke-dasharray="4"/>
    <line x1="45" y1="260" x2="430" y2="260" stroke="#1c2d4a" stroke-dasharray="4"/>
    <line x1="45" y1="310" x2="430" y2="310" stroke="#1c2d4a" stroke-dasharray="4"/>
    <line x1="45" y1="360" x2="430" y2="360" stroke="#2a4066" stroke-width="1.5"/>

    <rect x="75" y="270" width="26" height="90" rx="4" fill="url(#barGrad)"/>
    <rect x="135" y="230" width="26" height="130" rx="4" fill="url(#barGrad)"/>
    <rect x="195" y="250" width="26" height="110" rx="4" fill="url(#barGrad)"/>
    <rect x="255" y="200" width="26" height="160" rx="4" fill="url(#barGrad)"/>
    <rect x="315" y="220" width="26" height="140" rx="4" fill="url(#barGrad)"/>
    <rect x="375" y="190" width="26" height="170" rx="4" fill="url(#barGrad)"/>

    <path d="M88 260 L148 220 L208 240 L268 195 L328 215 L388 180" fill="none" stroke="#ffbd2e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="388" cy="180" r="5" fill="#ffbd2e"/>

    <!-- Right Side Feature weights -->
    <rect x="475" y="155" width="210" height="250" rx="10" fill="#111b2b" stroke="#1c2d4a" stroke-width="1"/>
    <text x="495" y="185" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Feature Importance</text>
    
    <text x="495" y="220" fill="#89a5cb" font-family="sans-serif" font-size="11">TF-IDF Vector Embeddings</text>
    <rect x="495" y="230" width="170" height="7" rx="3" fill="#1c2d4a"/>
    <rect x="495" y="230" width="150" height="7" rx="3" fill="#00d2ff"/>

    <text x="495" y="260" fill="#89a5cb" font-family="sans-serif" font-size="11">Random Forest Depth</text>
    <rect x="495" y="270" width="170" height="7" rx="3" fill="#1c2d4a"/>
    <rect x="495" y="270" width="125" height="7" rx="3" fill="#3a7bd5"/>

    <text x="495" y="300" fill="#89a5cb" font-family="sans-serif" font-size="11">Hyperparameter Tuning</text>
    <rect x="495" y="310" width="170" height="7" rx="3" fill="#1c2d4a"/>
    <rect x="495" y="310" width="160" height="7" rx="3" fill="#27c93f"/>

    <text x="495" y="355" fill="#7592ba" font-family="sans-serif" font-size="10.5">Pandas • Scikit-Learn • NumPy</text>
    <text x="495" y="375" fill="#00d2ff" font-family="sans-serif" font-size="10" font-weight="600">✓ Verified Certification Project</text>
  </g>
</svg>