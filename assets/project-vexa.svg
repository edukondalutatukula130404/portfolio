<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vexaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#151226"/>
      <stop offset="100%" stop-color="#07060d"/>
    </linearGradient>
    <linearGradient id="vexaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#vexaBg)" rx="16"/>
  <ellipse cx="400" cy="250" rx="300" ry="160" fill="#8b5cf6" opacity="0.15" filter="blur(40px)"/>

  <!-- Left Phone Mockup -->
  <g transform="translate(170, 45)" filter="url(#phoneShadow)">
    <rect width="210" height="410" rx="36" fill="#181824" stroke="#373549" stroke-width="3"/>
    <!-- Screen -->
    <rect x="8" y="8" width="194" height="394" rx="28" fill="#0f0e17"/>
    <!-- Dynamic Island -->
    <rect x="75" y="16" width="60" height="16" rx="8" fill="#000000"/>
    
    <text x="25" y="58" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">VEXA</text>
    <circle cx="175" cy="54" r="12" fill="#252433"/>

    <!-- Balance Card -->
    <rect x="20" y="75" width="170" height="95" rx="16" fill="url(#vexaGlow)"/>
    <text x="35" y="100" fill="#ffffff" font-family="sans-serif" font-size="10" opacity="0.8">TOTAL BALANCE</text>
    <text x="35" y="128" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900">$18,450.00</text>
    <text x="35" y="152" fill="#ffffff" font-family="sans-serif" font-size="10">+8.4% this week ↑</text>

    <!-- Quick Action Icons -->
    <circle cx="45" cy="195" r="16" fill="#1f1d2e"/>
    <text x="45" y="200" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">⚡</text>
    <circle cx="85" cy="195" r="16" fill="#1f1d2e"/>
    <text x="85" y="200" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">📤</text>
    <circle cx="125" cy="195" r="16" fill="#1f1d2e"/>
    <text x="125" y="200" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">📥</text>
    <circle cx="165" cy="195" r="16" fill="#1f1d2e"/>
    <text x="165" y="200" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">⚙</text>

    <!-- Recent Activity -->
    <text x="25" y="240" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Recent Transactions</text>
    
    <rect x="20" y="255" width="170" height="40" rx="10" fill="#181726"/>
    <circle cx="38" cy="275" r="10" fill="#ec4899"/>
    <text x="56" y="272" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Apple Store</text>
    <text x="56" y="285" fill="#71717a" font-family="sans-serif" font-size="8.5">Subscription</text>
    <text x="175" y="278" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">-$9.99</text>

    <rect x="20" y="305" width="170" height="40" rx="10" fill="#181726"/>
    <circle cx="38" cy="325" r="10" fill="#22c55e"/>
    <text x="56" y="322" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Client Payout</text>
    <text x="56" y="335" fill="#71717a" font-family="sans-serif" font-size="8.5">Speshway Corp</text>
    <text x="175" y="328" fill="#22c55e" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">+$1,250</text>
  </g>

  <!-- Right Phone Mockup (Angled / Tilted view) -->
  <g transform="translate(420, 65)" filter="url(#phoneShadow)">
    <rect width="210" height="390" rx="36" fill="#181824" stroke="#373549" stroke-width="3"/>
    <rect x="8" y="8" width="194" height="374" rx="28" fill="#0f0e17"/>
    <rect x="75" y="16" width="60" height="16" rx="8" fill="#000000"/>

    <text x="105" y="60" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Analytics &amp; Cards</text>
    
    <!-- Mini chart -->
    <rect x="20" y="85" width="170" height="115" rx="14" fill="#191728" stroke="#2d2b42" stroke-width="1"/>
    <text x="32" y="108" fill="#a1a1aa" font-family="sans-serif" font-size="10">SPENDING TREND</text>
    <path d="M35 170 C 60 140, 90 180, 115 130 C 140 150, 165 110, 175 115" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Virtual Card -->
    <rect x="20" y="215" width="170" height="95" rx="14" fill="#12111d" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="35" y="240" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">VEXA PLATINUM</text>
    <text x="35" y="275" fill="#cbd5e1" font-family="monospace" font-size="10">•••• 4821</text>
    <text x="175" y="295" fill="#8b5cf6" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="end">ACTIVE</text>
  </g>
</svg>