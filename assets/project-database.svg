<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dbBg)" rx="16"/>

  <g transform="translate(45, 35)">
    <rect width="710" height="430" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="25" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="25" r="5" fill="#27c93f"/>
    <text x="355" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">SQL Database Management &amp; Query Optimization Suite</text>
    <line x1="0" y1="48" x2="710" y2="48" stroke="#334155" stroke-width="1"/>

    <!-- SQL Code Editor -->
    <rect x="25" y="65" width="390" height="340" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="95" fill="#38bdf8" font-family="monospace" font-size="11.5">SELECT <tspan fill="#f8fafc">s.student_id, s.name, AVG(g.score)</tspan></text>
    <text x="45" y="120" fill="#38bdf8" font-family="monospace" font-size="11.5">FROM <tspan fill="#f8fafc">students s</tspan></text>
    <text x="45" y="145" fill="#38bdf8" font-family="monospace" font-size="11.5">JOIN <tspan fill="#f8fafc">academic_records g ON s.id = g.student_id</tspan></text>
    <text x="45" y="170" fill="#38bdf8" font-family="monospace" font-size="11.5">WHERE <tspan fill="#f8fafc">s.status = 'ACTIVE'</tspan></text>
    <text x="45" y="195" fill="#38bdf8" font-family="monospace" font-size="11.5">GROUP BY <tspan fill="#f8fafc">s.student_id, s.name</tspan></text>
    <text x="45" y="220" fill="#38bdf8" font-family="monospace" font-size="11.5">HAVING <tspan fill="#f8fafc">AVG(g.score) &gt;= 8.0;</tspan></text>

    <rect x="40" y="250" width="360" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="55" y="275" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">✓ EXECUTION PLAN: 0.84ms (INDEX SCAN)</text>
    <text x="55" y="298" fill="#94a3b8" font-family="sans-serif" font-size="11">Index Scan using idx_student_status on students</text>
    <text x="55" y="318" fill="#94a3b8" font-family="sans-serif" font-size="11">Hash Join (cost=12.50..45.12 rows=1450)</text>
    <text x="55" y="340" fill="#38bdf8" font-family="sans-serif" font-size="11">Buffers: shared hit=421 read=0</text>
    <text x="55" y="362" fill="#22c55e" font-family="sans-serif" font-size="11">Query Speedup: 94% faster than Sequential Scan</text>

    <!-- Schema Tables Graphic -->
    <rect x="435" y="65" width="250" height="155" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="435" y="65" width="250" height="30" rx="10" fill="#0f172a"/>
    <text x="450" y="86" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Table: students</text>
    <text x="450" y="115" fill="#38bdf8" font-family="monospace" font-size="10.5">PK id INT AUTO_INCREMENT</text>
    <text x="450" y="135" fill="#cbd5e1" font-family="monospace" font-size="10.5">   name VARCHAR(100)</text>
    <text x="450" y="155" fill="#cbd5e1" font-family="monospace" font-size="10.5">   email VARCHAR(100)</text>
    <text x="450" y="175" fill="#cbd5e1" font-family="monospace" font-size="10.5">   gpa DECIMAL(3,2)</text>
    <text x="450" y="195" fill="#cbd5e1" font-family="monospace" font-size="10.5">   created_at TIMESTAMP</text>

    <rect x="435" y="235" width="250" height="170" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="435" y="235" width="250" height="30" rx="10" fill="#0f172a"/>
    <text x="450" y="256" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Table: academic_records</text>
    <text x="450" y="285" fill="#38bdf8" font-family="monospace" font-size="10.5">PK rec_id INT AUTO_INC</text>
    <text x="450" y="305" fill="#fbbf24" font-family="monospace" font-size="10.5">FK student_id INT</text>
    <text x="450" y="325" fill="#cbd5e1" font-family="monospace" font-size="10.5">   subject_code VARCHAR(10)</text>
    <text x="450" y="345" fill="#cbd5e1" font-family="monospace" font-size="10.5">   marks_obtained INT</text>
    <text x="450" y="365" fill="#cbd5e1" font-family="monospace" font-size="10.5">   semester VARCHAR(10)</text>
  </g>
</svg>