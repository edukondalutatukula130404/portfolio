<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="clothBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#clothBg)" rx="16"/>

  <g transform="translate(45, 35)">
    <!-- Browser Frame -->
    <rect width="710" height="430" rx="14" fill="#141416" stroke="#2e2e33" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="25" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="25" r="5" fill="#27c93f"/>
    <rect x="220" y="14" width="270" height="22" rx="11" fill="#222226"/>
    <text x="355" y="29" fill="#a1a1aa" font-family="sans-serif" font-size="11" text-anchor="middle">https://clothing.speshway.site</text>
    <line x1="0" y1="48" x2="710" y2="48" stroke="#2e2e33" stroke-width="1"/>

    <!-- Fashion Header -->
    <text x="355" y="82" fill="#ffffff" font-family="serif" font-size="20" font-weight="700" letter-spacing="6" text-anchor="middle">ATELIER • SPESHWAY</text>
    <line x1="120" y1="95" x2="590" y2="95" stroke="#333" stroke-width="1"/>

    <!-- Hero Editorial Grid -->
    <rect x="25" y="110" width="370" height="295" rx="10" fill="#1e1e24" stroke="#33333d" stroke-width="1"/>
    <rect x="40" y="125" width="340" height="195" rx="8" fill="#121215"/>
    <text x="210" y="225" fill="#d4af37" font-family="sans-serif" font-size="34" text-anchor="middle">🧥</text>
    <text x="40" y="345" fill="#ffffff" font-family="serif" font-size="16" font-weight="700">AUTUMN/WINTER BESPOKE COAT</text>
    <text x="40" y="368" fill="#a1a1aa" font-family="sans-serif" font-size="12">Pure Cashmere &amp; Italian Wool Tailoring</text>
    <text x="40" y="392" fill="#d4af37" font-family="sans-serif" font-size="15" font-weight="bold">$480.00</text>

    <!-- Right Side Lookbook Cards -->
    <rect x="415" y="110" width="270" height="140" rx="10" fill="#1e1e24" stroke="#33333d" stroke-width="1"/>
    <text x="435" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">MINIMALIST ESSENTIALS</text>
    <text x="435" y="168" fill="#a1a1aa" font-family="sans-serif" font-size="11.5">Monochrome heavyweight cotton tee</text>
    <text x="435" y="195" fill="#d4af37" font-family="sans-serif" font-size="14" font-weight="bold">$75.00</text>
    <rect x="435" y="210" width="100" height="26" rx="13" fill="#ffffff"/>
    <text x="485" y="227" fill="#000000" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">View Detail ↗</text>

    <rect x="415" y="265" width="270" height="140" rx="10" fill="#1e1e24" stroke="#33333d" stroke-width="1"/>
    <text x="435" y="300" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">PREMIUM FOOTWEAR</text>
    <text x="435" y="323" fill="#a1a1aa" font-family="sans-serif" font-size="11.5">Hand-stitched leather Chelsea boots</text>
    <text x="435" y="350" fill="#d4af37" font-family="sans-serif" font-size="14" font-weight="bold">$320.00</text>
    <rect x="435" y="365" width="100" height="26" rx="13" fill="#d4af37"/>
    <text x="485" y="382" fill="#000000" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">View Detail ↗</text>
  </g>
</svg>