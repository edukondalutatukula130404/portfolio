<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="desktopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="desktopAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulseLive {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .live-dot {
        animation: pulseLive 2.2s ease-in-out infinite;
      }
      @keyframes shimmerAccent {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(99, 102, 241, 0.4)); }
        50% { filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.7)); }
      }
      .brand-accent {
        animation: shimmerAccent 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#desktopBg)" rx="16"/>

  <g transform="translate(45, 35)">
    <!-- Desktop Application Window Frame -->
    <rect width="710" height="430" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Titlebar & Native Window Controls -->
    <rect width="710" height="42" rx="12" fill="#131d33"/>
    <rect y="30" width="710" height="12" fill="#131d33"/>
    <circle cx="25" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="43" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="61" cy="21" r="5.5" fill="#10b981"/>
    
    <text x="355" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">InvoicePro Desktop • Persistent Local MongoDB Storage (v1.0.0)</text>
    <rect x="620" y="12" width="68" height="20" rx="4" fill="#1e293b"/>
    <text x="654" y="26" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle" class="live-dot">● LOCAL DB</text>
    <line x1="0" y1="42" x2="710" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- Left Desktop Navigation Sidebar -->
    <rect x="0" y="42" width="165" height="388" fill="#0a0f1d"/>
    <line x1="165" y1="42" x2="165" y2="430" stroke="#1e293b" stroke-width="1"/>

    <text x="22" y="74" fill="url(#desktopAccent)" font-family="sans-serif" font-size="13" font-weight="900" letter-spacing="0.5" class="brand-accent">⚡ INVOICEPRO</text>
    <text x="22" y="90" fill="#64748b" font-family="sans-serif" font-size="9.5" font-weight="600">ELECTRON DESKTOP</text>

    <!-- Active Menu: Invoices -->
    <rect x="12" y="106" width="141" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="127" fill="#ffffff" font-family="sans-serif" font-size="11.5" font-weight="700">📑 Invoices</text>

    <text x="28" y="162" fill="#94a3b8" font-family="sans-serif" font-size="11.5">👥 Clients CRM</text>
    <text x="28" y="196" fill="#94a3b8" font-family="sans-serif" font-size="11.5">💳 Transactions</text>
    <text x="28" y="230" fill="#94a3b8" font-family="sans-serif" font-size="11.5">📊 Reports &amp; Tax</text>
    <text x="28" y="264" fill="#94a3b8" font-family="sans-serif" font-size="11.5">🔑 License Manager</text>
    <text x="28" y="298" fill="#94a3b8" font-family="sans-serif" font-size="11.5">⚙ App Settings</text>

    <!-- Bottom Sidebar Status Badge -->
    <rect x="12" y="360" width="141" height="52" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="380" fill="#22c55e" font-family="sans-serif" font-size="10" font-weight="700" class="live-dot">● MONGODB READY</text>
    <text x="22" y="398" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Offline-First Engine</text>

    <!-- KPI Summary Row -->
    <rect x="185" y="60" width="155" height="68" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
    <text x="200" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">TOTAL BILLED</text>
    <text x="200" y="110" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">$128,450</text>
    <text x="290" y="110" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">+18%</text>

    <rect x="355" y="60" width="155" height="68" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
    <text x="370" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">PAID INVOICES</text>
    <text x="370" y="110" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">342 / 360</text>
    <text x="465" y="110" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">95%</text>

    <rect x="525" y="60" width="165" height="68" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
    <text x="540" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">INSTALLER BUILD</text>
    <text x="540" y="110" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">NSIS Portable</text>
    <text x="645" y="110" fill="#ec4899" font-family="sans-serif" font-size="10" font-weight="700">Win64</text>

    <!-- Main Workspace: Invoices Data Grid -->
    <rect x="185" y="142" width="505" height="270" rx="8" fill="#0d1526" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="185" y="142" width="505" height="34" rx="8" fill="#162238"/>
    <text x="202" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">INVOICE #</text>
    <text x="290" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">CLIENT NAME</text>
    <text x="430" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">DATE</text>
    <text x="525" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">AMOUNT</text>
    <text x="625" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">STATUS</text>

    <!-- Row 1 -->
    <line x1="185" y1="216" x2="690" y2="216" stroke="#1e293b" stroke-width="1"/>
    <text x="202" y="200" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600">INV-2026-089</text>
    <text x="290" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="11">Apex Global Logistics</text>
    <text x="430" y="200" fill="#94a3b8" font-family="sans-serif" font-size="11">15 Nov 2026</text>
    <text x="525" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="700">$12,400</text>
    <rect x="620" y="187" width="54" height="18" rx="4" fill="#065f46"/>
    <text x="647" y="200" fill="#34d399" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">PAID</text>

    <!-- Row 2 -->
    <line x1="185" y1="258" x2="690" y2="258" stroke="#1e293b" stroke-width="1"/>
    <text x="202" y="242" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600">INV-2026-088</text>
    <text x="290" y="242" fill="#f1f5f9" font-family="sans-serif" font-size="11">Vexa Cloud Services</text>
    <text x="430" y="242" fill="#94a3b8" font-family="sans-serif" font-size="11">12 Nov 2026</text>
    <text x="525" y="242" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="700">$8,750</text>
    <rect x="620" y="229" width="54" height="18" rx="4" fill="#065f46"/>
    <text x="647" y="242" fill="#34d399" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">PAID</text>

    <!-- Row 3 -->
    <line x1="185" y1="300" x2="690" y2="300" stroke="#1e293b" stroke-width="1"/>
    <text x="202" y="284" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600">INV-2026-087</text>
    <text x="290" y="284" fill="#f1f5f9" font-family="sans-serif" font-size="11">Speshway Retail Tech</text>
    <text x="430" y="284" fill="#94a3b8" font-family="sans-serif" font-size="11">09 Nov 2026</text>
    <text x="525" y="284" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="700">$16,200</text>
    <rect x="620" y="271" width="54" height="18" rx="4" fill="#854d0e"/>
    <text x="647" y="284" fill="#fde047" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">PENDING</text>

    <!-- Bottom Feature Badges -->
    <g transform="translate(200, 360)">
      <rect width="130" height="28" rx="6" fill="#131d33" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">⚡ Electron + React</text>
      
      <rect x="145" width="140" height="28" rx="6" fill="#131d33" stroke="#334155" stroke-width="1"/>
      <text x="215" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🍃 Local MongoDB</text>
      
      <rect x="300" width="165" height="28" rx="6" fill="#131d33" stroke="#334155" stroke-width="1"/>
      <text x="382" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">📦 Windows NSIS Installer</text>
    </g>
  </g>
</svg>
